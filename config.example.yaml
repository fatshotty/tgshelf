# tgshelf configuration — copy to config.yaml and edit.
# config.yaml is gitignored: it contains secrets.

data: ./data            # local data dir (file sessions, runtime state)

# PostgreSQL DSN. The DB environment variable overrides this value.
db: postgresql+asyncpg://tgshelf:tgshelf@localhost:5432/tgshelf

logger: info            # no | error | warn | info | debug

# Where Telegram login sessions are stored:
#   db   — tg_sessions table (single-instance deployments)
#   file — {data}/{name}.session, one set per instance (multiple servers
#          sharing the same DB and the same config must NOT share sessions)
session_storage: db

# Global throughput knob, valid for ALL clients (user + bot): number of TCP
# connections each client opens per DC for the data path (upload/download), with
# round-robin. Telegram throttles per-connection, so >1 raises throughput.
#   0 or 1 = off (one connection, the current behavior)
#   2      = safe sweet spot
# Going above 3 is discouraged: every client shares the server's single IP and
# there is a per-IP ceiling that more connections won't break through. Note the
# effect is asymmetric: upload speeds up even a single file, while download only
# benefits when bots are shared by concurrent streams (it lifts the per-bot
# connection budget, not the speed of a lone stream).
concurrent_tcp_connections: 1

telegram:
  users:                # accounts; entries with bot_token are bots
    - name: main
      api_id: 123456
      api_hash: "0123456789abcdef0123456789abcdef"
    - name: bot01
      api_id: 123456
      api_hash: "0123456789abcdef0123456789abcdef"
      bot_token: "123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  upload:
    # Files <= min_size bytes are stored inline in the DB, never on Telegram.
    # Must be a multiple of 524288 (the Telegram part size).
    min_size: 2097152
    # Master channel, mapped 1:1 to the root folder "/".
    channel: -1001234567890
  # Optional channel watcher: a DEDICATED brand-new bot (its own BotFather token,
  # NOT one of the `users` above) that watches the master channel LIVE and catalogs
  # posted files into root. Started ONLY by `serve`, as a dedicated
  # receive_updates=True instance; you must add it as an admin of the master
  # channel. Files posted while serve is down are NOT recovered automatically —
  # run `tgshelf import-channel`. Omit the whole block to disable.
  main_bot:
    api_id: 123456
    api_hash: "0123456789abcdef0123456789abcdef"
    bot_token: "987654321:AAyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
  notify:
    # Optional Bot HTTP API sender for CRITICAL/ERROR notifications. Leave
    # bot_token empty or omit it to keep notifications log-only.
    bot_token:
    # Optional destination: numeric id (-100.../-...) or @username. Empty means
    # the master/root channel above.
    channel:
    # Notification template. Each non-empty line is rendered only when all
    # placeholders on that line have a value, so you can remove, reorder, or add
    # fields without producing empty labels.
    #
    # Built-in template fields:
    #   {severity} — critical | error | warning
    #   {title}    — short human summary of the event
    #   {message}  — legacy/custom free-form summary; defaults to {title}
    #   {time}     — local ISO-8601 timestamp generated by the notifier
    #   {host}     — hostname of the tgshelf instance sending the alert
    #   {key}      — dedupe/event key when the caller provides one
    #
    # Common event fields. Events may provide additional custom keys; lines that
    # reference unknown keys are skipped.
    #   {impact}     — what is broken or degraded right now
    #   {scope}      — affected path, subtree, channel, pool, or operation scope
    #   {file_path}  — affected file path when the event is file-specific
    #   {node_id}    — tgshelf node id when known
    #   {part_idx}   — zero-based file part index when known
    #   {channel_id} — Telegram channel id involved in the event
    #   {account}    — Telegram user/bot account involved in the event
    #   {cause}      — likely cause in operator-friendly language
    #   {action}     — suggested next command or manual recovery step
    template: |
      [tgshelf:{severity}] {title}

      Impact: {impact}
      Scope: {scope}
      File: {file_path}
      Node: {node_id}
      Part: {part_idx}
      Channel: {channel_id}
      Account: {account}
      Cause: {cause}
      Action: {action}
      Time: {time}
      Host: {host}
      Key: {key}
    warning_window: 300
  # Proactive per-account rate limit: bench an account after `calls` Telegram API
  # calls within `window` seconds (reuses the FloodWait cooldown path). 0 = off.
  # coordination: memory (per-instance) | redis (cross-instance, not yet implemented).
  rate_limit:
    calls: 0
    window: 1.0
    coordination: memory

download:
  multi_bot_download: 3         # parallel bots per stream (1 = sequential)
  allow_user_fallback: false    # use user accounts when the bot pool is exhausted
  chunk_timeout: 6              # seconds without a chunk reply before the bot is replaced
  # Optional safety valve: estimated total buffer bytes above which NEW streams
  # start sequential (K=1) instead of multi-bot. Streams are NEVER refused or
  # queued; per-stream RAM is bounded at multi_bot_download x 1MiB. 0 = disabled.
  memory_soft_limit: 0

operations:             # throttling for massive Telegram operations (move/copy/delete)
  concurrent: 3
  sleep: 1              # seconds of pause between batches
  batch: 10             # operations per batch

http:
  enabled: true
  host: 127.0.0.1
  port: 3000
  user: ""              # empty = no basic auth
  pass: ""
  ignore_auth_for: []   # CIDR list bypassing basic auth, e.g. ["192.168.1.0/24"]

strm:
  destination: ./strm
  source: /
  # Arbitrary template for the .strm file content. The ONLY fixed requirement is
  # that the path starts with "<baseurl>/download/{file_id}" (file_id = first
  # segment after /download). Anything after — extra path segments and the whole
  # query string — is free and ignored by the server (decoration for clients/
  # players). Every placeholder you use is resolved from the node by the strm
  # generator: {file_id}=id, {filename}=name, {channel_id}=channel, {parts}=part
  # message_ids (by idx, comma-separated), {parts_dash}=same but dash-separated,
  # {size}=bytes, {mime}=mime.
  # NOTE: prefer {parts_dash} over {parts} in the PATH — Emby/ffmpeg reject a raw
  # comma (and a raw "|"); a dash join keeps the segment URL-safe ([0-9-] only).
  # e.g. "http://127.0.0.1:3000/download/{file_id}/{channel_id}/{parts_dash}"
  template: "http://127.0.0.1:3000/download/{file_id}/{filename}"
  clear_folder: false

changes_feed:
  enabled: false        # Postgres trigger + LISTEN/NOTIFY feed (mount / strm watch)
  retention_days: 7

# rclone integration. Mount the drive as a real read-write cloud-storage over
# WebDAV (data-plane) and push-invalidate rclone's directory cache the instant
# ANY writer (webui/CLI/watcher/manual) touches the tree (control-plane), so a
# new file/folder shows up at the next `ls` without waiting for --dir-cache-time.
#
# The rc endpoint is NOT configured here: the rclone client declares its own rc
# URL at mount time via headers, e.g.
#   rclone mount mywebdav: /mnt \
#     --header "X-Tgshelf-RC: http://<host-running-rclone>:5572" \
#     --header "X-Tgshelf-Token: <register_token below>"
# rclone must expose its rc reachable by tgshelf (--rc --rc-addr :5572, with
# --rc-user/--rc-pass embedded in the X-Tgshelf-RC URL if rc auth is enabled).
rclone:
  webdav_enabled: false   # serve the read-write WebDAV data-plane at /dav
  bridge_enabled: false   # LISTEN the changes feed → push vfs/forget (needs changes_feed.enabled)
  # Shared secret a client must send as X-Tgshelf-Token to register its rc URL.
  # Empty = self-registration disabled (no auto-refresh). Anti-SSRF: tgshelf only
  # POSTs to a declared rc URL when the token matches.
  register_token: ""
  # Extra CIDR allowlist for the declared rc host (the request's own source IP is
  # always allowed). e.g. ["192.168.1.0/24"]
  allowed_rc_networks: []
  registry_ttl: 600       # seconds an idle mount stays registered before it's dropped
